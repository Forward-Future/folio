name: Feature idea
description: Suggest something new or a change to how Folio works.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Please don't start building until a maintainer has agreed to the idea and its scope here.
        Folio stays simple, fast, and private, so not every good idea will fit.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
