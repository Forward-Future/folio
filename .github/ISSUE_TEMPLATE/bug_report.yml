name: Bug report
description: Something in Folio is broken, crashes, or behaves wrongly.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Search existing issues first, and keep this report to one problem.
  - type: input
    id: version
    attributes:
      label: Folio version
      description: Shown in About Folio.
      placeholder: "1.10.2"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options:
        - Windows
        - macOS
        - Linux (AppImage)
        - Linux (.deb)
        - Browser version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a PDF with ...
        2. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Error messages and screenshots help. If a specific PDF triggers it, attach it if you can share it.
    validations:
      required: true
