# Builds the installers for every platform when a version tag is pushed (scripts/release.mjs does that),
# checks that each packaged app starts, and hands the files to the release script as artifacts.
# Nothing is published from here: the maintainer's release script downloads these and creates the release.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win nsis portable
            files: |
              release/Folio-Setup.exe
              release/Folio-Setup.exe.blockmap
              release/Folio-Portable.exe
              release/latest.yml
          - os: macos-latest
            name: macos
            args: --mac
            files: |
              release/Folio-mac.dmg
              release/Folio-mac.dmg.blockmap
              release/Folio-mac.zip
              release/Folio-mac.zip.blockmap
              release/latest-mac.yml
          - os: ubuntu-latest
            name: linux
            args: --linux AppImage deb
            files: |
              release/Folio-linux-x86_64.AppImage
              release/Folio-linux-amd64.deb
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No Apple/Windows signing certificates yet: never look for them.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # Launch the packaged app and make sure it's still running after 20 seconds.
      - name: Packaged app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release/win-unpacked/Folio.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Folio exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Packaged app starts (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --verbose=2 release/mac-universal/Folio.app
          release/mac-universal/Folio.app/Contents/MacOS/Folio > app.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid"; then cat app.log; exit 1; fi
          kill "$pid"
      - name: Packaged app starts (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a release/linux-unpacked/folio --no-sandbox > app.log 2>&1 &
          sleep 20
          if ! pgrep -f linux-unpacked/folio > /dev/null; then cat app.log; exit 1; fi
          pkill -f linux-unpacked/folio

      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
