# Builds the installers for every platform when a version tag is pushed (scripts/release.mjs does that),
# checks that each packaged app starts, and hands the files to the release script as artifacts.
# Nothing is published from here: the maintainer's release script downloads these and creates the release.
#
# Signing is automatic once its secrets exist (see SIGNING.md):
#   macOS:   MAC_CERTIFICATE_P12_BASE64, MAC_CERTIFICATE_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#   Windows: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
#            AZURE_SIGNING_PROFILE, AZURE_SIGNING_PUBLISHER
#   Linux:   APT_SIGNING_KEY (signs the apt repository published with each release)
# Without them, macOS builds are ad-hoc signed and Windows builds are unsigned.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: --win nsis portable
            files: |
              release/Folio-Setup.exe
              release/Folio-Setup.exe.blockmap
              release/Folio-Portable.exe
              release/latest.yml
          - os: macos-latest
            name: macos
            args: --mac
            files: |
              release/Folio-mac.dmg
              release/Folio-mac.dmg.blockmap
              release/Folio-mac.zip
              release/Folio-mac.zip.blockmap
              release/latest-mac.yml
          - os: ubuntu-latest
            name: linux
            args: --linux AppImage deb
            files: |
              release/Folio-linux-x86_64.AppImage
              release/Folio-linux-amd64.deb
              release/latest-linux.yml
              release/Packages
              release/Packages.gz
              release/Release
              release/InRelease
              release/Release.gpg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ secrets.AZURE_SIGNING_PUBLISHER }}
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$MAC_CERTIFICATE_P12_BASE64" ]; then
            echo "Signing with the Developer ID certificate and notarizing"
            export CSC_LINK="$MAC_CERTIFICATE_P12_BASE64" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD" CSC_IDENTITY_AUTO_DISCOVERY=true
            # Signed builds install their own updates (Squirrel.Mac requires a Developer ID signature).
            extra+=(-c.mac.identity="Developer ID Application" -c.mac.hardenedRuntime=true -c.mac.notarize=true -c.extraMetadata.folioMacSigned=true)
          fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$AZURE_CLIENT_SECRET" ]; then
            echo "Signing with Azure Trusted Signing"
            extra+=(-c.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
              -c.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
              -c.win.azureSignOptions.certificateProfileName="$AZURE_SIGNING_PROFILE"
              -c.win.azureSignOptions.publisherName="$AZURE_SIGNING_PUBLISHER")
          fi
          npx electron-builder ${{ matrix.args }} "${extra[@]}" --publish never

      - name: Signed apt repository (Linux)
        if: runner.os == 'Linux'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get install -y -qq dpkg-dev apt-utils > /dev/null
          bash scripts/apt-repo.sh

      # Launch the packaged app and make sure it's still running after 20 seconds.
      - name: Packaged app starts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "release/win-unpacked/Folio.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Folio exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Packaged app starts (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --verbose=2 release/mac-universal/Folio.app
          release/mac-universal/Folio.app/Contents/MacOS/Folio > app.log 2>&1 &
          pid=$!
          sleep 20
          if ! kill -0 "$pid"; then cat app.log; exit 1; fi
          kill "$pid"
      - name: Packaged app starts (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a release/linux-unpacked/folio --no-sandbox > app.log 2>&1 &
          sleep 20
          if ! pgrep -f linux-unpacked/folio > /dev/null; then cat app.log; exit 1; fi
          pkill -f linux-unpacked/folio

      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
