# Daily safety net: makes sure the latest release carries every platform's installers and that all update
# feeds (Windows, macOS, Linux AppImage, apt) offer the same version. Opens an issue if anything is off.
name: Release check

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check the latest release
        id: check
        shell: bash # -o pipefail, so a failed check isn't hidden by tee
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release.mjs 2>&1 | tee result.txt
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Latest Folio release is incomplete for some platforms"
          body="$(cat result.txt)

          Found by the daily Release check workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
          Releases must be published with \`npm run release\` so every platform ships together (see AGENTS.md)."
          existing=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"; fi
